name: Verify published planner
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:build
      - name: Verify committed Pages output matches source
        run: |
          test -z "$(git status --porcelain -- docs)" || {
            echo 'Run npm run build and commit docs/ with the source changes.'
            git status --short -- docs
            exit 1
          }
